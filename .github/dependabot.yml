version: 2

updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    # Package bumps change the shipped binary, so they release a patch.
    commit-message:
      prefix: fix
      include: scope
    groups:
      apple-swift:
        patterns:
          - github.com/apple/swift-log
          - github.com/apple/swift-argument-parser
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    # Workflow bumps never touch the binary, so they don't release.
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
