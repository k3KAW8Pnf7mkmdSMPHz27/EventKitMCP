name: Release

# Tags every green push to main whose commits are releasable, then hands the tag
# to bump-tap.yml. The version is decided by .github/scripts/next-version.sh from
# conventional commit subjects, which squash-only merging makes the PR titles.
# The tag is the only place the version lives: the formula writes it into the
# source before building, so releasing never commits to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize releases so two quick merges can't both claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute the next version
        id: next
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Re-read tags after the concurrency group let us in, so a release
          # that finished while we queued is the one we count from.
          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::${SHA} is not on main" >&2; exit 1; }

          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          [ -n "$LAST" ] || { echo "::error::No vX.Y.Z tag to release from" >&2; exit 1; }
          NEXT=$(.github/scripts/next-version.sh "$LAST" "$SHA")

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          {
            echo "Last release \`$LAST\`, next \`${NEXT:-none}\`, from:"
            echo
            echo '```'
            git log --format='%h %s' "$LAST..$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        if: steps.next.outputs.next != ''
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      # A tag pushed with GITHUB_TOKEN doesn't trigger bump-tap.yml's tag event;
      # workflow_dispatch is the one event that token is allowed to start.
      - name: Bump the Homebrew tap
        if: steps.next.outputs.next != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.next }}
        run: gh workflow run bump-tap.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
